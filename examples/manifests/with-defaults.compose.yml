name: internal-tools
  
defaults:
    logRotation:
        schedule: "0 1 * * *"
        maxSizeMb: 100
        maxFiles: 7
        compress: true
    cluster:
        labels:
            tenant: internal
    restart: unless-stopped
  
networks:
    monitoring:
    ops:
    sidecar-local:
        local: true
  
volumes:
    shared-certs:
        strategy: local
        access: readOnlyMany
        backup:
            schedule: "0 0 1 * *"
            includes:
                - "**/*.pem"
                - "**/*.crt"
            destination:
                provider: s3
                bucket: internal-backups
                prefix: certs/
                region: us-east-1
                credentialsSecret: backup-s3-creds
  
    grafana-data:
        strategy: local
    prometheus-data:
        strategy: local
  
services:
    grafana:
        image: grafana/grafana:11.4.0
        networks:
            - monitoring
            - ops
        volumes:
            - grafana-data:/var/lib/grafana
            - shared-certs:/etc/ssl/certs:ro
        ingress:
            enabled: true
            hosts:
                - grafana.internal.example.com
            tls:
                certificateSecret: grafana-internal-tls
                privateKeySecret: grafana-internal-tls
  
    prometheus:
        image: prom/prometheus:v3.1.0
        networks:
            - monitoring
        expose:
            - "9090"
        volumes:
            - prometheus-data:/prometheus
        logRotation:
            schedule: "0 */4 * * *"
            paths:
                - /prometheus/logs/*.log
            maxSizeMb: 250
            maxFiles: 10
            compress: true
