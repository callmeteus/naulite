name: rushpedia
  
registries:
    default: ghcr
    entries:
        ghcr:
            url: ghcr.io
            credentialsSecret: ghcr-pull
  
networks:
    internal:
    edge:
    database:
  
services:
    backend:
        build:
            context: ./packages/backend
        buildOptions:
            provider: docker
        image: ghcr.io/techtail/rushpedia-backend:${VERSION}
        restart: unless-stopped
        networks:
            - internal
        expose:
            - "3000"
        logRotation:
            schedule: "0 2 * * *"
            paths:
                - /app/logs/*.log
            maxSizeMb: 100
            maxFiles: 10
            compress: true
        environment:
            NODE_ENV: production
            DB_HOST: postgres
        depends_on:
            - postgres
  
    frontend:
        build:
            context: ./packages/frontend
        image: ghcr.io/techtail/rushpedia-frontend:${VERSION}
        restart: unless-stopped
        networks:
            - edge
            - internal
        ingress:
            enabled: true
            hosts:
                - rushpedia.example.com
                - www.rushpedia.example.com
            tls: true
  
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        networks:
            - database
        volumes:
            - pgdata:/var/lib/postgresql/data
  
volumes:
    pgdata:
        strategy: local
        access: readWriteOnce
        size: 10Gi
