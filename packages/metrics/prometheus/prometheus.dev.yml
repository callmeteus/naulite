global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: naulite-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          role: control-plane

  - job_name: naulite
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json
        refresh_interval: 30s
