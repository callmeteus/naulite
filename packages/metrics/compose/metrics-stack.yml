name: naulite-metrics

services:
    naulite-prometheus:
        image: prom/prometheus:v3.12.0
        restart: unless-stopped
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
        volumes:
            - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - naulite-prometheus-file-sd:/etc/prometheus/file_sd
            - naulite-prometheus-data:/prometheus
        ports:
            - "${NAULITE_PROMETHEUS_HOST_PORT:-19090}:9090"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
            interval: 10s
            timeout: 5s
            retries: 6

volumes:
    naulite-prometheus-data:
    naulite-prometheus-file-sd:
