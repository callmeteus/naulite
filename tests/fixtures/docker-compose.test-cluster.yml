services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: platform
            POSTGRES_PASSWORD: platform
            POSTGRES_DB: platform
        ports:
            - "55432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U platform"]
            interval: 5s
            timeout: 5s
            retries: 10

    control-plane-1:
        build:
            context: ../../..
            dockerfile: packages/control-plane/Dockerfile
        environment:
            DATABASE_URL: postgres://platform:platform@postgres:5432/platform
            CP_INSTANCE_ID: cp-1
            NETBIRD_API_URL: http://127.0.0.1:1/api
            NETBIRD_MANAGEMENT_URL: http://127.0.0.1:1
        ports:
            - "18080:8080"
        depends_on:
            postgres:
                condition: service_healthy

    agent-node-a:
        build:
            context: ../../..
            dockerfile: packages/agent/Dockerfile
        environment:
            NODE_ID: agent-1
            HOSTNAME: agent-1
            PLATFORM_CP_URL: http://control-plane-1:8080
            AGENT_URL: http://agent-node-a:9470
            AGENT_PORT: "9470"
            AGENT_VERSION: zig-0.1.0
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "19001:9470"
        depends_on:
            control-plane-1:
                condition: service_started
