name: platform

include:
    - path: infra/netbird/docker-compose.yml
      project_directory: infra/netbird

platform:
    version: 0.1.0
    plugins:
        enabled:
            - s3

services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: platform
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
            POSTGRES_DB: platform
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U platform"]
            interval: 5s
            timeout: 3s
            retries: 10
        ports:
            - "5432:5432"

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        volumes:
            - minio-data:/data
        ports:
            - "9000:9000"
            - "9001:9001"

    control-plane-1:
        build:
            context: .
            dockerfile: packages/control-plane/Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            netbird-server:
                condition: service_started
        environment:
            NODE_ENV: production
            DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:-platform}@postgres:5432/platform
            PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-}
            NETBIRD_PUBLIC_MANAGEMENT_URL: ${NETBIRD_PUBLIC_MANAGEMENT_URL:-}
            NETBIRD_API_URL: ${NETBIRD_API_URL:-http://netbird-server/api}
            NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-http://netbird-server}
            CP_INSTANCE_ID: cp-1
            CP_PEER_URLS: http://control-plane-2:8080
            CP_PLUGINS: s3
            S3_ENDPOINT: http://minio:9000
            S3_FORCE_PATH_STYLE: "true"
        ports:
            - "8080:8080"
        volumes:
            - cp-data-1:/var/lib/platform
        networks:
            - default
            - netbird

    control-plane-2:
        build:
            context: .
            dockerfile: packages/control-plane/Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            netbird-server:
                condition: service_started
        environment:
            NODE_ENV: production
            DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:-platform}@postgres:5432/platform
            PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-}
            NETBIRD_PUBLIC_MANAGEMENT_URL: ${NETBIRD_PUBLIC_MANAGEMENT_URL:-}
            NETBIRD_API_URL: ${NETBIRD_API_URL:-http://netbird-server/api}
            NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-http://netbird-server}
            CP_INSTANCE_ID: cp-2
            CP_PEER_URLS: http://control-plane-1:8080
            CP_PLUGINS: s3
            S3_ENDPOINT: http://minio:9000
            S3_FORCE_PATH_STYLE: "true"
        ports:
            - "8081:8080"
        volumes:
            - cp-data-2:/var/lib/platform
        networks:
            - default
            - netbird

    ui-backend:
        build:
            context: .
            dockerfile: packages/ui/packages/backend/Dockerfile
        restart: unless-stopped
        depends_on:
            - control-plane-1
        environment:
            NODE_ENV: production
            CONTROL_PLANE_URL: http://control-plane-1:8080
            ADMIN_API_KEY: ${ADMIN_API_KEY:-}

    ui:
        build:
            context: .
            dockerfile: packages/ui/Dockerfile
            args:
                VITE_ADMIN_API_URL: /api
        restart: unless-stopped
        depends_on:
            - ui-backend
        ports:
            - "3000:80"

    agent-1:
        build:
            context: .
            dockerfile: packages/agent/Dockerfile
        restart: unless-stopped
        environment:
            NODE_ID: agent-1
            HOSTNAME: agent-1
            PLATFORM_CP_URL: http://control-plane-1:8080
            AGENT_URL: http://agent-1:9470
            AGENT_PORT: "9470"
            AGENT_VERSION: zig-0.1.0
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            control-plane-1:
                condition: service_started
        ports:
            - "9470:9470"

volumes:
    pgdata:
    minio-data:
    cp-data-1:
    cp-data-2:
