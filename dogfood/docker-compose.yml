name: naulite

include:
    - path: infra/postgres-ha/docker-compose.yml
      project_directory: infra/postgres-ha
    - path: infra/netbird/docker-compose.yml
      project_directory: infra/netbird
    - path: ../packages/metrics/compose/metrics-stack.yml
      project_directory: ../packages/metrics/compose

services:
    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        volumes:
            - minio-data:/data
        ports:
            - "9000:9000"
            - "9001:9001"

    traefik-dynamic-config:
        profiles: [traefik]
        image: node:22-alpine
        restart: unless-stopped
        working_dir: /app
        command: ["node", "server.mjs"]
        volumes:
            - ./infra/traefik/dynamic-config-store:/app:ro

    traefik-config:
        profiles: [traefik]
        image: node:22-alpine
        restart: "no"
        working_dir: /work
        command: ["node", "render-traefik-config.mjs"]
        environment:
            NAULITE_TLS_MODE: ${NAULITE_TLS_MODE:-acme_tls}
            ACME_EMAIL: ${ACME_EMAIL:-platform@localhost}
            ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
            CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
        volumes:
            - ./infra/traefik:/work:rw

    traefik:
        profiles: [traefik]
        image: traefik:v3.3
        restart: unless-stopped
        depends_on:
            traefik-dynamic-config:
                condition: service_started
            traefik-config:
                condition: service_completed_successfully
        environment:
            CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
        volumes:
            - ./infra/traefik/traefik.generated.yml:/etc/traefik/traefik.yml:ro
            - traefik-acme:/acme
        ports:
            - "80:80"
            - "443:443"
            - "8088:8080"
        command:
            - --configFile=/etc/traefik/traefik.yml

    control-plane-1:
        build:
            context: ..
            dockerfile: packages/control-plane/Dockerfile
        restart: unless-stopped
        depends_on:
            pgpool:
                condition: service_healthy
            netbird-server:
                condition: service_started
            traefik-dynamic-config:
                condition: service_started
                required: false
        environment:
            NODE_ENV: production
            DATABASE_URL: postgres://naulite:${POSTGRES_PASSWORD:-naulite}@pgpool:5432/naulite
            NAULITE_PUBLIC_URL: ${NAULITE_PUBLIC_URL:-}
            NETBIRD_PUBLIC_MANAGEMENT_URL: ${NETBIRD_PUBLIC_MANAGEMENT_URL:-}
            NETBIRD_API_URL: ${NETBIRD_API_URL:-http://netbird-server/api}
            NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-http://netbird-server}
            TRAEFIK_DYNAMIC_CONFIG_URL: ${TRAEFIK_DYNAMIC_CONFIG_URL:-http://traefik-dynamic-config:8099/naulite/dynamic-config}
            NAULITE_TLS_MODE: ${NAULITE_TLS_MODE:-acme_tls}
            CP_INSTANCE_ID: cp-1
            CP_PEER_URLS: http://control-plane-2:8080
            CP_PLUGINS: s3
            S3_ENDPOINT: http://minio:9000
            S3_FORCE_PATH_STYLE: "true"
            PROMETHEUS_URL: ${PROMETHEUS_URL:-http://naulite-prometheus:9090}
            NAULITE_PROMETHEUS_FILE_SD_DIR: ${NAULITE_PROMETHEUS_FILE_SD_DIR:-/var/lib/naulite/prometheus/file_sd}
            NAULITE_METRICS_SYNC_ENABLED: ${NAULITE_METRICS_SYNC_ENABLED:-true}
            NAULITE_E2E_ALLOW_BRIDGE: ${NAULITE_E2E_ALLOW_BRIDGE:-1}
            NAULITE_BOOTSTRAP_ADMIN_USERNAME: ${NAULITE_BOOTSTRAP_ADMIN_USERNAME:-admin@naulite.local}
            NAULITE_BOOTSTRAP_ADMIN_PASSWORD: ${NAULITE_BOOTSTRAP_ADMIN_PASSWORD:-naulite-dev}
        ports:
            - "8080:8080"
        volumes:
            - cp-data-1:/var/lib/naulite
            - naulite-prometheus-file-sd:/var/lib/naulite/prometheus/file_sd
        networks:
            - default
            - netbird

    control-plane-2:
        build:
            context: ..
            dockerfile: packages/control-plane/Dockerfile
        restart: unless-stopped
        depends_on:
            pgpool:
                condition: service_healthy
            netbird-server:
                condition: service_started
            traefik-dynamic-config:
                condition: service_started
                required: false
        environment:
            NODE_ENV: production
            DATABASE_URL: postgres://naulite:${POSTGRES_PASSWORD:-naulite}@pgpool:5432/naulite
            NAULITE_PUBLIC_URL: ${NAULITE_PUBLIC_URL:-}
            NETBIRD_PUBLIC_MANAGEMENT_URL: ${NETBIRD_PUBLIC_MANAGEMENT_URL:-}
            NETBIRD_API_URL: ${NETBIRD_API_URL:-http://netbird-server/api}
            NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-http://netbird-server}
            TRAEFIK_DYNAMIC_CONFIG_URL: ${TRAEFIK_DYNAMIC_CONFIG_URL:-http://traefik-dynamic-config:8099/naulite/dynamic-config}
            NAULITE_TLS_MODE: ${NAULITE_TLS_MODE:-acme_tls}
            CP_INSTANCE_ID: cp-2
            CP_PEER_URLS: http://control-plane-1:8080
            CP_PLUGINS: s3
            S3_ENDPOINT: http://minio:9000
            S3_FORCE_PATH_STYLE: "true"
            PROMETHEUS_URL: ${PROMETHEUS_URL:-http://naulite-prometheus:9090}
            NAULITE_PROMETHEUS_FILE_SD_DIR: ${NAULITE_PROMETHEUS_FILE_SD_DIR:-/var/lib/naulite/prometheus/file_sd}
            NAULITE_METRICS_SYNC_ENABLED: ${NAULITE_METRICS_SYNC_ENABLED:-true}
            NAULITE_E2E_ALLOW_BRIDGE: ${NAULITE_E2E_ALLOW_BRIDGE:-1}
            NAULITE_BOOTSTRAP_ADMIN_USERNAME: ${NAULITE_BOOTSTRAP_ADMIN_USERNAME:-admin@naulite.local}
            NAULITE_BOOTSTRAP_ADMIN_PASSWORD: ${NAULITE_BOOTSTRAP_ADMIN_PASSWORD:-naulite-dev}
        ports:
            - "8081:8080"
        volumes:
            - cp-data-2:/var/lib/naulite
            - naulite-prometheus-file-sd:/var/lib/naulite/prometheus/file_sd
        networks:
            - default
            - netbird

    ui-backend:
        build:
            context: ..
            dockerfile: packages/ui/packages/backend/Dockerfile
        restart: unless-stopped
        depends_on:
            - control-plane-1
        environment:
            NODE_ENV: production
            CONTROL_PLANE_URL: http://control-plane-1:8080
            ADMIN_API_KEY: ${ADMIN_API_KEY:-}

    ui:
        build:
            context: ..
            dockerfile: packages/ui/Dockerfile
            args:
                VITE_ADMIN_API_URL: /api
        restart: unless-stopped
        depends_on:
            - ui-backend
        ports:
            - "${NAULITE_UI_HOST_PORT:-13000}:80"

    agent-1:
        build:
            context: ..
            dockerfile: packages/agent/Dockerfile
        restart: unless-stopped
        user: "${NAULITE_AGENT_USER:-1000:1000}"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - NET_RAW
        devices:
            - /dev/net/tun
        group_add:
            - "${DOCKER_SOCKET_GID:-999}"
        environment:
            NODE_ID: agent-1
            HOSTNAME: agent-1
            NAULITE_CP_URL: http://control-plane-1:8080
            AGENT_URL: http://agent-1:9470
            AGENT_PORT: "9470"
            AGENT_VERSION: zig-0.1.0
            NAULITE_AGENT_CONFIG: /var/lib/naulite/agent.json
            NETBIRD_MANAGEMENT_URL: ${NETBIRD_MANAGEMENT_URL:-http://netbird-server}
            NETBIRD_SETUP_KEY: ${NETBIRD_SETUP_KEY:-}
        extra_hosts:
            # NetBird server exposes signal/STUN as netbird.local; map to the host-published port.
            - "netbird.local:host-gateway"
        volumes:
            # tmpfs avoids Docker Desktop volume ownership issues when NAULITE_AGENT_USER=0:0
            - type: tmpfs
              target: /var/lib/naulite
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            control-plane-1:
                condition: service_started
        ports:
            - "9470:9470"
        networks:
            - default
            - netbird

volumes:
    minio-data:
    cp-data-1:
    cp-data-2:
    traefik-acme:
    naulite-prometheus-file-sd:
