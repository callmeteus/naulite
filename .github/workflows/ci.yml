name: CI

on:
    push:
        branches: [main, master]
    pull_request:

env:
    # Keep in sync with infra/zig-toolchain.env and packages/agent/Dockerfile ARG ZIG_VERSION
    ZIG_VERSION: "0.16.0"
    REQUIRE_DOCKER: "true"
    ARTIFACTS_ROOT: /artifacts

jobs:
    verify:
        runs-on: self-hosted
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: yarn
                  cache-dependency-path: yarn.lock

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}

            - name: Build Zig agent
              working-directory: packages/agent
              run: zig build -Doptimize=ReleaseSafe

            - name: Test Zig agent
              working-directory: packages/agent
              run: zig build test

            - name: Build Zig CLI
              working-directory: packages/cli
              run: zig build

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Unit tests
              run: yarn test:unit

            - name: Verify Docker
              run: |
                  docker version
                  docker info

            - name: Docker unit tests
              run: yarn test:unit:docker

            - name: Build
              run: yarn build

    docker-smoke:
        runs-on: self-hosted
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build agent image
              run: docker build -t naulite-agent -f packages/agent/Dockerfile .

            - name: Build control-plane image
              run: docker build -t naulite-control-plane -f packages/control-plane/Dockerfile .

            - name: Build UI image
              run: docker build -t naulite-ui -f packages/ui/Dockerfile .

            - name: Build UI backend image
              run: docker build -t naulite-ui-backend -f packages/ui/packages/backend/Dockerfile .

    image-scan:
        needs: docker-smoke
        runs-on: self-hosted
        timeout-minutes: 45

        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: naulite-agent
                      dockerfile: packages/agent/Dockerfile
                    - image: naulite-control-plane
                      dockerfile: packages/control-plane/Dockerfile
                    - image: naulite-ui
                      dockerfile: packages/ui/Dockerfile
                    - image: naulite-ui-backend
                      dockerfile: packages/ui/packages/backend/Dockerfile

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build image
              run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} .

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ matrix.image }}
                  format: table
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: os,library
                  severity: CRITICAL

            - name: Generate SBOM with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ matrix.image }}
                  format: cyclonedx
                  output: sbom-${{ matrix.image }}.cyclonedx.json

            - name: Store SBOM artifact
              uses: ./.github/actions/store-artifact
              with:
                  package: naulite-sbom-${{ matrix.image }}
                  paths: |
                      sbom-${{ matrix.image }}.cyclonedx.json
