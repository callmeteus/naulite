name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: yarn
                  cache-dependency-path: yarn.lock

            - name: Setup Zig
              uses: goto-bus-stop/setup-zig@v2
              with:
                  version: 0.14.0

            - name: Build Zig agent
              working-directory: packages/agent
              run: zig build -Doptimize=ReleaseSafe

            - name: Test Zig agent
              working-directory: packages/agent
              run: zig build test

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Unit tests
              run: yarn test:unit

            - name: Verify Docker
              run: |
                  docker version
                  docker info

            - name: Docker unit tests
              env:
                  REQUIRE_DOCKER: "true"
              run: yarn test:unit:docker

            - name: E2E tests
              env:
                  REQUIRE_DOCKER: "true"
              run: yarn test:e2e

            - name: Build
              run: yarn build
