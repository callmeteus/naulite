name: CI

on:
    push:
        branches: [main, master]
    pull_request:

env:
    # Keep in sync with infra/zig-toolchain.env and packages/agent/Dockerfile ARG ZIG_VERSION
    ZIG_VERSION: "0.16.0"
    REQUIRE_DOCKER: "true"

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: yarn
                  cache-dependency-path: yarn.lock

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}

            - name: Build Zig agent
              working-directory: packages/agent
              run: zig build -Doptimize=ReleaseSafe

            - name: Test Zig agent
              working-directory: packages/agent
              run: zig build test

            - name: Build Zig CLI
              working-directory: packages/cli
              run: zig build

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Unit tests
              run: yarn test:unit

            - name: Verify Docker
              run: |
                  docker version
                  docker info

            - name: Docker unit tests
              run: yarn test:unit:docker

            - name: Build
              run: yarn build

    docker-smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build agent image
              run: docker build -f packages/agent/Dockerfile .

            - name: Build control-plane image
              run: docker build -f packages/control-plane/Dockerfile .

            - name: Build UI image
              run: docker build -f packages/ui/Dockerfile .

            - name: Build UI backend image
              run: docker build -f packages/ui/packages/backend/Dockerfile .
