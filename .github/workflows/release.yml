name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - v*

permissions:
    contents: read
    packages: write

env:
    ARTIFACTS_ROOT: /artifacts

jobs:
    release:
        runs-on: self-hosted

        strategy:
            fail-fast: false
            matrix:
                include:
                    - dockerfile: packages/agent/Dockerfile
                      image: naulite-agent
                    - dockerfile: packages/control-plane/Dockerfile
                      image: naulite-control-plane
                    - dockerfile: packages/ui/Dockerfile
                      image: naulite-ui
                    - dockerfile: packages/ui/packages/backend/Dockerfile
                      image: naulite-ui-backend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Resolve semver
              id: version
              shell: bash
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      echo "semver=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
                  else
                      echo "semver=dev-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.semver }}
                      ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
